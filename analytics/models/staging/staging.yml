models:
  - name: stg_job_postings
    description: >
     One row per posting per the scrape day, a job re-scraped across day keeps every row.
    columns:
      - name: job_id
        description: Scrapers posting job_id
        data_tests:
          - not_null
      - name: search_term
        description: The role the scraper searched for
        data_tests:
         - accepted_values:
             arguments:
               values: ['Data Engineer', 'Data Analyst', 'Data Scientist']
      - name: search_date
        description: Date scraped
      - name: searched_at_time
        description: Time posting was scraped
      - name: search_location
        description: Location the scraper searched for
      - name: job_title
        description: Job title from scraped posting
      - name: company_name
        description: Name of company_name
      - name: job_location
        description: Location role is associated with
      - name: source_platform
        description: job platform posting was scraped from
      - name: job_schedule_type
        description: As scraped
        data_tests:
         - accepted_values:
             arguments:
               values: ['Full-time', 'Part-time', 'Contactor', 'Internship']
             config:
               severity: warn
      - name: job_work_from_home
        description: True when posting is flagged remote
      - name: job_posted_at
        description: Time job was job_posted_at
      - name: job_salary
        description: Salary described via posting
      - name: salary_min
        description: Lower bound of parsed job salary
        data_tests:
          - non_negative
      - name: salary_max
        description: Upper bound of parsed job salary
        data_tests:
          - non_negative
      - name: salary_avg
        description: Mid point of parsed job salary range (always pair with salary_currency)
      - name: salary_period
        description: Pay period parsed from job_salary
      - name: salary_currency
        description: Currency parsed from job salary, NULL if no entry in job salary column
      - name: has_no_degree_mentioned
        description: Posting lists no degree mentioned in the extensions
      - name: has_paid_time_off
        description: Posting lists paid time off mentioned in the extensions
      - name: has_health_insurance
        description: Posting lists health insurance mentioned in the extensions
      - name: has_dental_insurance
        description: Posting lists dental insurance mentioned in the extensions

  - name: stg_job_skills
    description: >
     One row per (job_id, skill_id) pair directy from the table. Mainly organized, trimmed, and cleaned.
    columns:
      - name: job_id
        description: Every paor's parent exists in stg_job_postings
      - name: skill_id
        description: Skill key for the pair
      - name: skill_keyword
        description: Skill text as extracted and trimmed

unit_tests:
  - name: test_parse_salart_shape
    description: "This handles a range, single value, and no salary"
    model: stg_job_postings
    given:
      - input: source('jobs', 'raw_job_postings')
        rows:
          - {job_id: 1, job_salary: "100K–186K a year"}
          - {job_id: 2, job_salary: "32.50 an hour"}
          - {job_id: 3, job_salary: null}
          - {job_id: 4, job_salary: "98700 a year"}
          - {job_id: 5, job_salary: "38000–45000 a year"}
    expect:
      rows:
        - {job_id: 1, salary_min: 100000, salary_max: 186000}
        - {job_id: 2, salary_min: 32.5, salary_max: 32.5}
        - {job_id: 3, salary_min: null, salary_max: null}
        - {job_id: 4, salary_min: 98700, salary_max: 98700}
        - {job_id: 5, salary_min: 38000, salary_max: 45000}